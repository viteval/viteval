<svg xmlns="http://www.w3.org/2000/svg" width="216" height="216" viewBox="1190 340 216 216" role="img" aria-labelledby="title">
  <title id="title">Loading</title>
  <defs>
    <clipPath id="liquid-clip"><circle cx="1298" cy="471" r="61"/></clipPath>
  </defs>
  <style>
    .wave-front { animation: slosh 2.8s ease-in-out infinite; transform-origin: 1298px 471px; }
    .wave-back { animation: slosh 3.6s ease-in-out infinite reverse; transform-origin: 1298px 471px; }
    @keyframes slosh { 0%, 100% { transform: rotate(-6deg) translateY(1px); } 50% { transform: rotate(6deg) translateY(-1px); } }
    @media (prefers-reduced-motion: reduce) { .wave-front, .wave-back { animation: none; } }
  </style>
