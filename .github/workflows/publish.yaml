name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

env:
  NODE_VERSION: 26
  PNPM_VERSION: 12.11.2

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: '⬇️ Checkout Repo'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: '🟨 Install pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: '💚 Setup Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: '📦 Install Packages'
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: pnpm validate && pnpm validate:consumer

      - name: '🔄 Create Release Pull Request or Publish'
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          create-github-releases: true
          publish-script: pnpm run publish
          version-script: pnpm run version
          pr-title: 'chore(release): version packages'
          commit-message: 'chore(release): version packages'
